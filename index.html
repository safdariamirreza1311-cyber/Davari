<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سامانه داوری مسابقات بولدرینگ</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --bg-main: #0f172a;
      --bg-card: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Tahoma, sans-serif;
    }
    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      padding: 16px;
      min-height: 100vh;
    }
    header {
      text-align: center;
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 1px solid #334155;
    }
    header h1 {
      font-size: 1.5rem;
      color: var(--accent);
      margin-bottom: 6px;
    }
    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: bold;
    }
    .status-connected { background-color: rgba(34, 197, 94, 0.2); color: var(--success); }
    .status-disconnected { background-color: rgba(239, 68, 68, 0.2); color: var(--danger); }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
    }
    .card {
      background-color: var(--bg-card);
      border-radius: 12px;
      padding: 16px;
      border: 1px solid #334155;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
    }
    .card h2 {
      font-size: 1.1rem;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--accent);
    }
    .control-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    input, select {
      width: 100%;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #475569;
      background-color: #0f172a;
      color: #fff;
      font-size: 0.95rem;
    }
    .btn-group {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:active { opacity: 0.8; }
    .btn-top { background-color: var(--success); color: #fff; }
    .btn-zone { background-color: var(--warning); color: #000; }
    .btn-reset { background-color: #475569; color: #fff; }
    .score-box {
      margin-top: 12px;
      padding: 8px;
      background: #0f172a;
      border-radius: 6px;
      font-size: 0.85rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <h1>🧗‍♂️ پنل مانیتورینگ و داوری سنگنوردی</h1>
    <div id="connStatus" class="status-badge status-disconnected">در حال اتصال به سرور...</div>
  </header>

  <main class="grid">
    <!-- مسیر ۱ -->
    <div class="card" id="route-1">
      <h2><span>مسیر ۱ (بولدر ۱)</span> <span id="badge-1" class="status-badge" style="background:#334155;">آماده</span></h2>
      <div class="control-group">
        <label>نام ورزشکار:</label>
        <input type="text" id="climber-1" placeholder="نام ورزشکار..." onchange="sendUpdate(1)">
      </div>
      <div class="control-group">
        <label>تعداد تلاش (Attempts):</label>
        <input type="number" id="attempts-1" value="0" min="0" onchange="sendUpdate(1)">
      </div>
      <div class="btn-group">
        <button class="btn-zone" onclick="toggleZone(1)">ثبت تاپ زون (Zone)</button>
        <button class="btn-top" onclick="toggleTop(1)">ثبت تاپ (Top)</button>
      </div>
      <div class="score-box" id="result-1">وضعیت: بدون امتیاز</div>
    </div>

    <!-- مسیر ۲ -->
    <div class="card" id="route-2">
      <h2><span>مسیر ۲ (بولدر ۲)</span> <span id="badge-2" class="status-badge" style="background:#334155;">آماده</span></h2>
      <div class="control-group">
        <label>نام ورزشکار:</label>
        <input type="text" id="climber-2" placeholder="نام ورزشکار..." onchange="sendUpdate(2)">
      </div>
      <div class="control-group">
        <label>تعداد تلاش (Attempts):</label>
        <input type="number" id="attempts-2" value="0" min="0" onchange="sendUpdate(2)">
      </div>
      <div class="btn-group">
        <button class="btn-zone" onclick="toggleZone(2)">ثبت تاپ زون (Zone)</button>
        <button class="btn-top" onclick="toggleTop(2)">ثبت تاپ (Top)</button>
      </div>
      <div class="score-box" id="result-2">وضعیت: بدون امتیاز</div>
    </div>
  </main>

  <script>
    const socket = io();
    const connStatus = document.getElementById('connStatus');

    let state = {
      1: { climber: '', attempts: 0, zone: false, top: false },
      2: { climber: '', attempts: 0, zone: false, top: false }
    };

    socket.on('connect', () => {
      connStatus.textContent = '🟢 متصل به سرور مرکزی';
      connStatus.className = 'status-badge status-connected';
    });

    socket.on('disconnect', () => {
      connStatus.textContent = '🔴 قطع ارتباط با سرور';
      connStatus.className = 'status-badge status-disconnected';
    });

    socket.on('initial_state', (data) => {
      for (const id in data) {
        state[id] = data[id];
        renderCard(id);
      }
    });

    socket.on('judge_updated', (data) => {
      state[data.judgeId] = data;
      renderCard(data.judgeId);
    });

    function toggleZone(id) {
      state[id].zone = !state[id].zone;
      sendUpdate(id);
    }

    function toggleTop(id) {
      state[id].top = !state[id].top;
      if (state[id].top) state[id].zone = true;
      sendUpdate(id);
    }

    function sendUpdate(id) {
      state[id].climber = document.getElementById(`climber-${id}`).value;
      state[id].attempts = parseInt(document.getElementById(`attempts-${id}`).value) || 0;
      state[id].judgeId = id;

      socket.emit('update_judge', state[id]);
      renderCard(id);
    }

    function renderCard(id) {
      const data = state[id];
      if (!data) return;

      document.getElementById(`climber-${id}`).value = data.climber || '';
      document.getElementById(`attempts-${id}`).value = data.attempts || 0;

      const resBox = document.getElementById(`result-${id}`);
      let statusText = `تلاش: ${data.attempts} | `;
      if (data.top) {
        statusText += `🏆 تاپ شد (تلاش ${data.attempts})`;
      } else if (data.zone) {
        statusText += `🔶 زون کسب شد`;
      } else {
        statusText += `درحال صعود / بدون تاپ`;
      }
      resBox.textContent = statusText;
    }
  </script>
</body>
</html>
